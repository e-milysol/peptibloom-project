name: Research Basics Release QA

on:
  push:
    branches:
      - release/research-basics-2026-09-11-rc1
  pull_request:
    branches:
      - main

jobs:
  web-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Astro check
        run: npm run check
      - name: Compound platform fail-closed validation
        run: npm run validate:compound-platform
      - name: Build
        run: npm run build
